name: Windows release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install into a fresh virtual environment
        run: |
          python -m venv .build-venv
          .\.build-venv\Scripts\python.exe -m pip install --upgrade pip
          .\.build-venv\Scripts\python.exe -m pip install -r requirements.txt pyinstaller

      - name: Build
        run: .\.build-venv\Scripts\python.exe -m PyInstaller --noconfirm --clean WallpaperLibrary.spec

      - name: Zip the portable folder
        run: Compress-Archive -Path dist\WallpaperLibrary -DestinationPath WallpaperLibrary-windows.zip

      - name: Attach the zip to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: WallpaperLibrary-windows.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
